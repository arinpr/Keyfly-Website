# Builds the static site and deploys it to keyfly.si on Cloudflare.
# Runs on every push to main, hourly (so prices from the pricing API stay
# current), and by hand. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN  (Workers Scripts: Edit, Workers Routes: Edit, Zone: Read on keyfly.si)
#   CLOUDFLARE_ACCOUNT_ID (the account that holds the keyfly.si zone)
name: Deploy keyfly.si

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # A failed pricing fetch fails the build; the live site keeps its last good deploy.
          REQUIRE_PRICING: "1"
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
